groups:
  - name: tollgate-availability
    rules:
      - alert: TollgateBackendDown
        expr: up{job="tollgate-backend"} == 0
        for: 2m
        labels: {severity: critical}
        annotations:
          summary: Tollgate backend is not being scraped
          description: Prometheus has not reached {{ $labels.instance }} for 2 minutes.

      - alert: TollgateHigh5xxRate
        expr: |
          sum(rate(tollgate_http_requests_total{status=~"5.."}[5m]))
            / clamp_min(sum(rate(tollgate_http_requests_total[5m])), 1e-9) > 0.05
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: More than 5% of API requests are failing with 5xx

      - alert: TollgateHighLatencyP95
        expr: |
          histogram_quantile(0.95, sum by (le) (rate(tollgate_http_request_duration_seconds_bucket[5m]))) > 2
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: p95 API latency above 2s

  - name: tollgate-security
    rules:
      - alert: TollgateCriticalThreatSpike
        expr: sum(increase(tollgate_guardrail_threats_total{severity=~"high|critical"}[5m])) > 20
        for: 1m
        labels: {severity: critical}
        annotations:
          summary: Spike of high/critical guardrail threats (possible prompt injection campaign)

      - alert: TollgateBlockedRatioHigh
        expr: |
          sum(rate(tollgate_gateway_evaluations_total{status="blocked"}[10m]))
            / clamp_min(sum(rate(tollgate_gateway_evaluations_total[10m])), 1e-9) > 0.3
        for: 10m
        labels: {severity: warning}
        annotations:
          summary: More than 30% of gateway evaluations are blocked

      - alert: TollgateRateLimitAbuse
        expr: sum by (scope) (rate(tollgate_rate_limited_total[5m])) > 5
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: Sustained 429 responses on scope {{ $labels.scope }} (possible brute force or scraping)

      - alert: TollgateAuthFailuresHigh
        expr: sum(rate(tollgate_http_requests_total{route="/api/auth/signin",status="401"}[5m])) > 2
        for: 5m
        labels: {severity: warning}
        annotations:
          summary: Elevated failed sign-in rate (possible credential stuffing)
