global:
  scrape_interval: 15s
  evaluation_interval: 15s
  external_labels:
    service: tollgate

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: tollgate-backend
    metrics_path: /metrics
    static_configs:
      - targets: ["backend:8001"]
    # Enable when METRICS_TOKEN is set on the backend (mount the token as a file):
    # authorization:
    #   type: Bearer
    #   credentials_file: /etc/prometheus/metrics_token

  - job_name: prometheus
    static_configs:
      - targets: ["localhost:9090"]
