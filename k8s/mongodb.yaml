# In-cluster MongoDB for staging. In production prefer a managed MongoDB (Atlas) and point MONGO_URL at it.
apiVersion: v1
kind: Service
metadata:
  name: tollgate-mongo
  namespace: tollgate
  labels:
    app.kubernetes.io/name: tollgate-mongo
    app.kubernetes.io/part-of: tollgate
spec:
  clusterIP: None
  selector:
    app.kubernetes.io/name: tollgate-mongo
  ports:
    - name: mongo
      port: 27017
      targetPort: 27017
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: tollgate-mongo
  namespace: tollgate
  labels:
    app.kubernetes.io/name: tollgate-mongo
    app.kubernetes.io/part-of: tollgate
spec:
  serviceName: tollgate-mongo
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tollgate-mongo
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tollgate-mongo
        app.kubernetes.io/part-of: tollgate
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 999
        runAsGroup: 999
        fsGroup: 999
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: mongo
          image: mongo:7.0
          ports:
            - name: mongo
              containerPort: 27017
          envFrom:
            - secretRef:
                name: tollgate-mongo-secrets
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 250m, memory: 512Mi}
            limits: {cpu: "1", memory: 1Gi}
          readinessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
            initialDelaySeconds: 30
            periodSeconds: 20
          volumeMounts:
            - name: data
              mountPath: /data/db
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        resources:
          requests:
            storage: 10Gi
