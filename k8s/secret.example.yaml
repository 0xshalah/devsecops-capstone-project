# or use Sealed Secrets / External Secrets Operator / Vault.
apiVersion: v1
kind: Secret
metadata:
  name: tollgate-backend-secrets
  namespace: tollgate
type: Opaque
stringData:
  MONGO_URL: "mongodb://tollgate:CHANGE_ME@tollgate-mongo:27017/?authSource=admin"
  JWT_SECRET: "CHANGE_ME"
  API_KEY_HMAC_SECRET: "CHANGE_ME"
  METRICS_TOKEN: "CHANGE_ME"
  DEMO_PASSWORD: "CHANGE_ME"
  LLM_BASE_URL: ""
  LLM_API_KEY: ""
  LLM_MODEL: ""
---
apiVersion: v1
kind: Secret
metadata:
  name: tollgate-mongo-secrets
  namespace: tollgate
type: Opaque
stringData:
