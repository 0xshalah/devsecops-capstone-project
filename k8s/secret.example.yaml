# TEMPLATE ONLY. Never commit real values. Create the secret out of band, e.g.:
#   kubectl -n tollgate create secret generic tollgate-backend-secrets \
#     --from-literal=MONGO_URL='mongodb://tollgate:<pw>@tollgate-mongo:27017/?authSource=admin' \
