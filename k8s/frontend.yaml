apiVersion: apps/v1
kind: Deployment
metadata:
  name: tollgate-frontend
  namespace: tollgate
  labels:
    app.kubernetes.io/name: tollgate-frontend
    app.kubernetes.io/component: web
    app.kubernetes.io/part-of: tollgate
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels:
      app.kubernetes.io/name: tollgate-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tollgate-frontend
        app.kubernetes.io/component: web
        app.kubernetes.io/part-of: tollgate
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 101
        runAsGroup: 101
        fsGroup: 101
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: frontend
          image: ghcr.io/0xshalah/tollgate-frontend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: tollgate-frontend-config
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 50m, memory: 64Mi}
            limits: {cpu: 250m, memory: 128Mi}
          livenessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 15
          readinessProbe:
            httpGet: {path: /healthz, port: http}
            periodSeconds: 10
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            - name: nginx-conf
              mountPath: /etc/nginx/conf.d
      volumes:
        - name: tmp
          emptyDir: {}
        - name: nginx-conf
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: tollgate-frontend
  namespace: tollgate
  labels:
    app.kubernetes.io/name: tollgate-frontend
    app.kubernetes.io/part-of: tollgate
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tollgate-frontend
  ports:
    - name: http
      port: 80
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: tollgate-frontend
  namespace: tollgate
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tollgate-frontend
