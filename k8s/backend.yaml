apiVersion: v1
kind: ServiceAccount
metadata:
  name: tollgate-backend
  namespace: tollgate
automountServiceAccountToken: false
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tollgate-backend
  namespace: tollgate
  labels:
    app.kubernetes.io/name: tollgate-backend
    app.kubernetes.io/component: api
    app.kubernetes.io/part-of: tollgate
spec:
  replicas: 2
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate: {maxSurge: 1, maxUnavailable: 0}
  selector:
    matchLabels:
      app.kubernetes.io/name: tollgate-backend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: tollgate-backend
        app.kubernetes.io/component: api
        app.kubernetes.io/part-of: tollgate
      annotations:
        prometheus.io/scrape: "true"
        prometheus.io/port: "8001"
        prometheus.io/path: /metrics
    spec:
      serviceAccountName: tollgate-backend
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: kubernetes.io/hostname
          whenUnsatisfiable: ScheduleAnyway
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: tollgate-backend
      containers:
        - name: backend
          image: ghcr.io/0xshalah/tollgate-backend:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8001
          envFrom:
            - configMapRef:
                name: tollgate-backend-config
            - secretRef:
                name: tollgate-backend-secrets
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests: {cpu: 100m, memory: 256Mi}
            limits: {cpu: 500m, memory: 512Mi}
          startupProbe:
            httpGet: {path: /api/health/live, port: http}
            periodSeconds: 5
            failureThreshold: 24
          livenessProbe:
            httpGet: {path: /api/health/live, port: http}
            periodSeconds: 15
            timeoutSeconds: 3
            failureThreshold: 3
          readinessProbe:
            httpGet: {path: /api/health, port: http}
            periodSeconds: 10
            timeoutSeconds: 3
            failureThreshold: 3
          volumeMounts:
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: tmp
          emptyDir: {}
---
apiVersion: v1
kind: Service
metadata:
  name: tollgate-backend
  namespace: tollgate
  labels:
    app.kubernetes.io/name: tollgate-backend
    app.kubernetes.io/part-of: tollgate
spec:
  type: ClusterIP
  selector:
    app.kubernetes.io/name: tollgate-backend
  ports:
    - name: http
      port: 8001
      targetPort: http
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: tollgate-backend
  namespace: tollgate
spec:
  minAvailable: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: tollgate-backend
---
apiVersion: autoscaling/v2
kind: HorizontalPodAutoscaler
metadata:
  name: tollgate-backend
  namespace: tollgate
spec:
  scaleTargetRef:
    apiVersion: apps/v1
    kind: Deployment
    name: tollgate-backend
  minReplicas: 2
  maxReplicas: 6
  metrics:
    - type: Resource
      resource:
        name: cpu
        target: {type: Utilization, averageUtilization: 70}
